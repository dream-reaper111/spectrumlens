[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "spectrumlens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]
[project.optional-dependencies]
image = ["matplotlib>=3.8,<5"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
[project.scripts]
spectrumlens = "spectrumlens.cli:main"
[tool.setuptools.packages.find]
include = ["spectrumlens*"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
